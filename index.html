<head>

    <style>
        :root {
            --bg-main: #fff8e7;
            --border-color: #947445;
            --header-bg: #e9d8b3;
            --hover-bg: #eadfca;
            --text-color: #3b3529;
            --accent-color: #73432b;
            --green-text: #215c35;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-color);
            font-size: 13px;
        }

        .header-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .header-title h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: var(--accent-color);
        }

        .header-title p {
            margin: 0;
            font-size: 11px;
            color: #624e32;
        }

        .lang-picker {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-btn {
            background: #ecdfc3;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .lang-btn.active {
            background: var(--border-color);
            color: #fff;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
        }

        .kcs-compact-table {
            width: 100%;
            min-width: 980px;
            border-collapse: collapse;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            background: var(--bg-main);
        }

        .kcs-compact-table th, 
        .kcs-compact-table td {
            box-sizing: border-box;
            border-bottom: 1px solid #e2d5ba;
            padding: 6px 4px;
            text-align: right;
            white-space: nowrap;
        }

        .kcs-compact-table thead th {
            background: var(--header-bg);
            text-align: center;
            height: 38px;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid var(--border-color);
        }

        .th-unit-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 10px;
        }

        .unit-icon {
            width: 18px;
            height: 18px;
            fill: #5c452a;
        }

        .kcs-compact-table tbody tr:hover {
            background: var(--hover-bg);
        }

        .kcs-compact-player {
            text-align: left !important;
            font-weight: bold;
            background: #ecdfc3;
            border-right: 2px solid var(--border-color);
            position: sticky;
            left: 0;
            z-index: 1;
        }

        .kcs-compact-village {
            text-align: left !important;
        }

        .kcs-intel-positive {
            color: var(--green-text);
            font-weight: bold;
        }

        .kcs-intel-zero {
            color: #a99c84;
        }

        .kcs-intel-no-data {
            text-align: left !important;
            color: #8b7a60;
            font-style: italic;
        }

        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 8px 4px;
            background: #ecdfc3;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .pagination-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .pagination-btn:disabled {
            background: #c2b49a;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const t = translations[lang];
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('th-player').innerText = t.player;
    document.getElementById('th-village').innerText = t.village;
    document.getElementById('th-coords').innerText = t.coords;
    document.getElementById('th-points').innerText = t.points;

    document.querySelectorAll('.u-name').forEach(el => {
        const u = el.getAttribute('data-unit');
        if (t.units[u]) el.innerText = t.units[u];
    });

    renderTable();
}

function renderTable() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pagePlayers = playersData.slice(start, end);

    pagePlayers.forEach(p => {
        p.villages.forEach((v, idx) => {
            const tr = document.createElement('tr');
            
            if (idx === 0) {
                const tdP = document.createElement('td');
                tdP.className = 'kcs-compact-player';
                tdP.rowSpan = p.villages.length;
                tdP.innerText = p.name;
                tr.appendChild(tdP);
            }

            let troopsHTML = '';
            if (v.troops) {
                troopsHTML = v.troops.map(val => `<td class="${val > 0 ? 'kcs-intel-positive' : 'kcs-intel-zero'}">${val.toLocaleString('ro-RO')}</td>`).join('');
            } else {
                troopsHTML = `<td colspan="11" class="kcs-intel-no-data">${translations[currentLang].noData}</td>`;
            }

            tr.innerHTML += `
                <td class="kcs-compact-village">${v.name}</td>
                <td>${v.coords}</td>
                <td>${v.pts}</td>
                ${troopsHTML}
            `;
            tbody.appendChild(tr);
        });
    });

    const totalPages = Math.ceil(playersData.length / itemsPerPage) || 1;
    const t = translations[currentLang];
    document.getElementById('page-info').innerText = `${t.page} ${currentPage} ${t.of} ${totalPages}`;
    document.getElementById('btn-prev').disabled = currentPage === 1;
    document.getElementById('btn-next').disabled = currentPage === totalPages;
    document.getElementById('btn-prev').innerText = t.prev;
    document.getElementById('btn-next').innerText = t.next;
}

function changePage(dir) {
    currentPage += dir;
    renderTable();
}

// Inițializare tabel
renderTable();
