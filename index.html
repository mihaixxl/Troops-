<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kael — Trupele alianței</title>
<style>
:root{
  --bg:#f2dfb8;--paper:#fff7e4;--paper2:#f4e2bb;--head:#edd3a0;
  --line:#a57435;--line2:#d8ba80;--text:#4b2d1a;--muted:#8e795e;
  --brown:#7e351d;--brown2:#5f2615;--off:#08783f;--def:#d42c24;
  --gold:#b87900;--gold2:#8f5c00;--shadow:0 6px 18px rgba(89,55,19,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  padding:8px;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%,rgba(255,255,255,.85),transparent 25%),
    linear-gradient(180deg,#f8ecd0 0%,#ead2a4 100%);
}
.app{max-width:1580px;margin:0 auto}

/* HEADER */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  min-height:72px;padding:9px 14px;margin-bottom:8px;border:1px solid var(--line);
  border-radius:10px;background:linear-gradient(180deg,#f2ddb2,#e7c891);box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.topbar:after{
  content:"";position:absolute;right:180px;top:0;width:420px;height:100%;opacity:.09;pointer-events:none;
  background:linear-gradient(90deg,transparent,#7f4b24,transparent);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;z-index:1}
.crest{
  width:51px;height:55px;flex:0 0 51px;display:grid;place-items:center;
  border:2px solid #5c2513;border-radius:12px 12px 18px 18px;
  background:linear-gradient(180deg,#a34524,#6c2815);color:#ffe6a2;
  font:900 24px Georgia,serif;box-shadow:inset 0 0 0 2px rgba(255,221,147,.35);
}
.brand h1{margin:0;font:700 27px Georgia,serif;line-height:1;color:#5d2716}
.brand-sub{margin-top:4px;font-size:12px;font-weight:700;color:#6a4b30}
.updated{
  display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 9px;
  border:1px solid #ccb278;border-radius:999px;background:rgba(255,250,234,.83);
  font-size:10px;font-weight:800;color:#693a23;
}
.updated:before{content:"";width:8px;height:8px;border-radius:50%;background:#48b965;box-shadow:0 0 0 2px rgba(72,185,101,.15)}
.langs{display:flex;gap:6px;z-index:1}
.lang-btn{
  height:40px;min-width:48px;padding:0 12px;border:1px solid #ad8550;border-radius:8px;
  background:#fff8e8;color:#57301d;font-weight:900;cursor:pointer;box-shadow:0 2px 4px rgba(70,40,15,.08);
}
.lang-btn.active{background:linear-gradient(180deg,#963c20,#6e2815);border-color:#632413;color:#fff}

/* TOOLBAR */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;margin-bottom:8px;
  border:1px solid #ceb07c;border-radius:10px;background:rgba(255,248,232,.95);box-shadow:0 3px 10px rgba(80,50,20,.06);
}
.funnel{font-size:23px;color:#6d301b;margin-right:2px}
.filter-btn{
  height:40px;min-width:132px;padding:0 18px;border-radius:8px;border:1px solid #b6905b;
  background:#fff9ec;color:#5f3c27;font-size:13px;font-weight:900;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
}
.filter-btn img{width:28px;height:28px;object-fit:contain}
.filter-btn[data-filter="off"]{border-color:#559469;color:#17663b}
.filter-btn[data-filter="def"]{border-color:#d17467;color:#a82924}
.filter-btn[data-filter="counts"]{border-color:#c89a3c;color:#8a5b00}
.filter-btn.active[data-filter="all"]{background:linear-gradient(180deg,#8d3c22,#6d2917);color:#fff;border-color:#642414}
.filter-btn.active[data-filter="off"]{background:linear-gradient(180deg,#258b50,#0c6a39);color:#fff;border-color:#07572f}
.filter-btn.active[data-filter="def"]{background:linear-gradient(180deg,#eb7567,#c93d32);color:#fff;border-color:#b72d25}
.filter-btn.active[data-filter="counts"]{background:linear-gradient(180deg,#eab94c,#bd7a0a);color:#fff;border-color:#a66a05}
.search-wrap{margin-left:auto;display:flex;align-items:center;min-width:280px;max-width:430px;flex:1}
.search-wrap input{
  width:100%;height:40px;padding:0 13px;border:1px solid #b99d70;border-radius:8px;background:#fffdf8;
  color:#4b3423;font-size:13px;outline:none;box-shadow:inset 0 1px 2px rgba(82,51,21,.06);
}
.reset-btn{
  height:40px;padding:0 16px;border:1px solid #682514;border-radius:8px;
  background:linear-gradient(180deg,#933a20,#692514);color:#fff;font-weight:900;cursor:pointer;
}

/* TABLE */
.table-shell{border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.table-viewport{width:100%;overflow-x:auto;overflow-y:hidden}
.table-scale{transform-origin:top left;width:max-content}
table{
  width:1180px;min-width:1180px;border-collapse:collapse;table-layout:fixed;
  font-size:11px;font-variant-numeric:tabular-nums;background:var(--paper);
}
thead th{
  height:46px;padding:2px 3px;text-align:center;vertical-align:middle;
  background:linear-gradient(180deg,#efd9aa,#e5c68d);border-right:1px solid #d2b37b;border-bottom:2px solid var(--line);
  color:#55351f;font-weight:900;position:sticky;top:0;z-index:3;
}
th.col-player{width:155px} th.col-village{width:160px} th.col-coord{width:90px} th.col-points{width:72px} th.unit-col{width:64px}
.unit-h{display:flex;align-items:center;justify-content:center;height:100%}
.unit-img{width:31px;height:31px;object-fit:contain;display:block;filter:drop-shadow(0 1px 1px rgba(70,40,15,.18))}
tbody td{
  height:25px;padding:2px 5px;border-right:1px solid #eadbc0;border-bottom:1px solid #dfceb0;
  white-space:nowrap;text-align:right;background:#fff9e9;overflow:visible;text-overflow:clip;
}
tbody tr:nth-child(even) td{background:#fdf4df}
tbody tr:hover td{background:#f7e7c5}
.group-start td{border-top:2px solid #9e7138}
.player-cell{
  text-align:left!important;font-weight:900;font-size:11px;vertical-align:middle;padding-left:12px!important;
  background:#ead6b0!important;border-right:2px solid #b18449!important;overflow:hidden!important;text-overflow:ellipsis!important;
}
.village-cell{text-align:left!important;padding-left:10px!important;overflow:hidden!important;text-overflow:ellipsis!important}
.coord-cell{text-align:center!important}.points-cell{text-align:center!important}
.no-data{text-align:left!important;color:#9b8970;font-style:italic;font-size:12px;background:#fff9e9!important;padding-left:12px!important}
.val-off{color:var(--off);font-weight:900}.val-def{color:var(--def);font-weight:900}.val-count{color:var(--gold2);font-weight:900}.val-zero{color:#9c917e;font-weight:500}
.empty{padding:28px;text-align:center;font-weight:800;color:#83674a}

/* FOOTER */
.footerbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:8px;padding:6px 8px;border:1px solid #cfb17c;border-radius:9px;background:rgba(255,248,232,.96);
}
.page-size{display:flex;align-items:center;gap:6px;font-size:11px}.page-size select{height:34px;border:1px solid #b89a69;border-radius:7px;background:#fff;padding:0 9px}
.pager{display:flex;align-items:center;gap:12px}.page-btn{
  height:38px;padding:0 17px;border:1px solid #662414;border-radius:8px;
  background:linear-gradient(180deg,#8b381f,#692514);color:#fff;font-weight:900;cursor:pointer;
}
.page-btn:disabled{opacity:.32;cursor:not-allowed}.page-info{font-size:12px;font-weight:900}
.footer-stats{display:flex;gap:7px;flex-wrap:wrap}.badge{
  display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid #d3b982;border-radius:8px;background:#fffaf0;font-size:10px;font-weight:900;
}
.badge.off{color:var(--off)}.badge.def{color:var(--def)}.badge.gold{color:var(--gold2)}
.badge img{width:22px;height:22px;object-fit:contain}

/* MOBILE: keep EXACT table layout, scale the entire table so values never get cut */
@media(max-width:900px){
  body{padding:4px}
  .topbar{min-height:0;padding:7px 8px;margin-bottom:5px;gap:7px}
  .crest{width:37px;height:40px;flex-basis:37px;font-size:18px;border-radius:9px 9px 13px 13px}
  .brand{gap:7px}.brand h1{font-size:19px}.brand-sub{font-size:9px;margin-top:2px}.updated{font-size:8px;padding:2px 6px;margin-top:2px}
  .langs{margin-left:auto}.lang-btn{height:31px;min-width:40px;padding:0 8px;font-size:10px}
  .toolbar{padding:5px;gap:5px;margin-bottom:5px}.funnel{display:none}
  .filter-btn{height:31px;min-width:auto;padding:0 10px;font-size:10px;gap:4px}.filter-btn img{width:20px;height:20px}
  .search-wrap{order:10;min-width:100%;max-width:none;margin-left:0}.search-wrap input{height:32px;font-size:11px}
  .reset-btn{height:31px;padding:0 9px;font-size:10px}
  .table-viewport{overflow:hidden}
  .footerbar{position:sticky;bottom:3px;z-index:20;padding:5px;box-shadow:0 7px 22px rgba(72,42,15,.18)}
  .footer-stats{display:none}.page-size{display:none}.pager{width:100%;justify-content:space-between;gap:6px}.page-btn{height:34px;padding:0 11px;font-size:10px}.page-info{font-size:10px}
}
</style>

let lang="ro",activeFilter="all",searchText="",page=1,perPage=10;
const t=()=>i18n[lang];
function fmt(n){return Number(n).toLocaleString(lang==="fr"?"fr-FR":lang==="en"?"en-US":"ro-RO")}
function hasAny(troops,indexes){return Array.isArray(troops)&&indexes.some(i=>Number(troops[i]||0)>0)}
function isOff(v){return hasAny(v.troops,OFF_INDEXES)}
function isDef(v){return hasAny(v.troops,DEF_INDEXES)}
function hasCount(v){return Array.isArray(v.troops)&&Number(v.troops[COUNT_INDEX]||0)>0}
function villageMatches(v,pname){
  if(activeFilter==="off"&&!isOff(v))return false;
  if(activeFilter==="def"&&!isDef(v))return false;
  if(activeFilter==="counts"&&!hasCount(v))return false;
  if(searchText){const hay=(pname+" "+v.name+" "+v.coords).toLowerCase();if(!hay.includes(searchText))return false}
  return true;
}
function getFilteredPlayers(){return playersData.map(p=>({name:p.name,villages:p.villages.filter(v=>villageMatches(v,p.name))})).filter(p=>p.villages.length)}
function totalVillageCount(){return playersData.reduce((n,p)=>n+p.villages.length,0)}
function allVillageStats(){const a=playersData.flatMap(p=>p.villages);return{off:a.filter(isOff).length,def:a.filter(isDef).length,counts:a.filter(hasCount).length}}
function cellClass(i,v){if(Number(v)===0)return"val-zero";if(i===COUNT_INDEX)return"val-count";if(i===SPY_INDEX||OFF_INDEXES.includes(i))return"val-off";return"val-def"}

function renderTexts(){
  const x=t();document.documentElement.lang=lang;
  document.getElementById("title").textContent=x.title;
  document.getElementById("subtitle").textContent=`${playersData.length} ${x.players} · ${totalVillageCount()} ${x.villages} · ${WORLD}`;
  document.getElementById("updated").textContent=`${x.updated}: ${LAST_UPDATED}`;
  document.getElementById("search").placeholder=x.search;
  document.getElementById("resetBtn").textContent=x.reset;
  document.getElementById("hPlayer").textContent=x.player;
  document.getElementById("hVillage").textContent=x.village;
  document.getElementById("hCoords").textContent=x.coords;
  document.getElementById("hPoints").textContent=x.points;
  document.getElementById("empty").textContent=x.noResult;
  document.getElementById("perPageLabel").textContent=x.perPage;
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
}

function renderTable(){
  const x=t(),list=getFilteredPlayers();
  const pages=Math.max(1,Math.ceil(list.length/perPage));if(page>pages)page=pages;
  const subset=list.slice((page-1)*perPage,page*perPage),tbody=document.getElementById("tbody");tbody.innerHTML="";
  subset.forEach((player,pi)=>{
    player.villages.forEach((v,vi)=>{
      const tr=document.createElement("tr");if(pi>0&&vi===0)tr.classList.add("group-start");
      if(vi===0){const td=document.createElement("td");td.className="player-cell";td.rowSpan=player.villages.length;td.textContent=player.name;tr.appendChild(td)}
      const a=document.createElement("td");a.className="village-cell";a.textContent=v.name;tr.appendChild(a);
      const b=document.createElement("td");b.className="coord-cell";b.textContent=v.coords;tr.appendChild(b);
      const c=document.createElement("td");c.className="points-cell";c.textContent=v.pts;tr.appendChild(c);
      if(!Array.isArray(v.troops)){
        const td=document.createElement("td");td.colSpan=11;td.className="no-data";td.textContent=x.noData;tr.appendChild(td);
      }else{
        v.troops.forEach((value,i)=>{const td=document.createElement("td");td.className=cellClass(i,value);td.textContent=fmt(value);tr.appendChild(td)});
      }
      tbody.appendChild(tr);
    });
  });
  document.getElementById("empty").hidden=list.length!==0;
  document.getElementById("tableViewport").style.display=list.length?"":"none";
  document.getElementById("pageInfo").textContent=`${x.page} ${page} ${x.of} ${pages}`;
  document.getElementById("prev").textContent=x.prev;document.getElementById("next").textContent=x.next;
  document.getElementById("prev").disabled=page<=1;document.getElementById("next").disabled=page>=pages;
  const s=allVillageStats();
  document.getElementById("offStat").innerHTML=`<img src="https://s1-ro.kingsage.gameforge.com/img/units_big/axe_big.png" referrerpolicy="no-referrer" alt=""> ${x.offVillages}: ${s.off}`;
  document.getElementById("defStat").innerHTML=`<img src="https://s1-ro.kingsage.gameforge.com/img/units_big/sword_big.png" referrerpolicy="no-referrer" alt=""> ${x.defVillages}: ${s.def}`;
  document.getElementById("countStat").innerHTML=`<img src="https://s1-ro.kingsage.gameforge.com/img/units_big/snob_big.png" referrerpolicy="no-referrer" alt=""> ${x.countVillages}: ${s.counts}`;
  requestAnimationFrame(fitTable);
}

function fitTable(){
  const viewport=document.getElementById("tableViewport"),scaleBox=document.getElementById("tableScale"),table=document.getElementById("troopTable");
  if(!viewport||!scaleBox||!table)return;
  scaleBox.style.transform="none";viewport.style.height="auto";
  if(window.innerWidth<=900){
    const naturalW=table.offsetWidth,naturalH=table.offsetHeight,available=viewport.clientWidth;
    const scale=Math.min(1,available/naturalW);
    scaleBox.style.transform=`scale(${scale})`;
    viewport.style.height=Math.ceil(naturalH*scale)+"px";
  }else{
    scaleBox.style.transform="none";viewport.style.height="auto";
  }
}

function render(){renderTexts();renderTable()}
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{
  if(activeFilter===btn.dataset.filter){activeFilter="all";btn.classList.remove("active");}
  else{activeFilter=btn.dataset.filter;document.querySelectorAll(".filter-btn").forEach(x=>x.classList.toggle("active",x===btn));}
  page=1;renderTable();
}));
document.querySelectorAll(".lang-btn").forEach(btn=>btn.addEventListener("click",()=>{lang=btn.dataset.lang;page=1;render()}));
document.getElementById("search").addEventListener("input",e=>{searchText=e.target.value.trim().toLowerCase();page=1;renderTable()});
document.getElementById("resetBtn").addEventListener("click",()=>{activeFilter="all";searchText="";page=1;document.getElementById("search").value="";document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));renderTable()});
document.getElementById("pageSize").addEventListener("change",e=>{perPage=Number(e.target.value)||10;page=1;renderTable()});
document.getElementById("prev").addEventListener("click",()=>{if(page>1){page--;renderTable();window.scrollTo({top:0,behavior:"smooth"})}});
document.getElementById("next").addEventListener("click",()=>{const pages=Math.max(1,Math.ceil(getFilteredPlayers().length/perPage));if(page<pages){page++;renderTable();window.scrollTo({top:0,behavior:"smooth"})}});
window.addEventListener("resize",()=>requestAnimationFrame(fitTable));
window.addEventListener("load",()=>requestAnimationFrame(fitTable));
render();
</script>
