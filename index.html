<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kael — Trupele alianței</title>

<style>
:root{
  --bg:#f5e8c9;
  --paper:#fff8e7;
  --paper2:#ecd6a7;
  --line:#9b6a2f;
  --line-soft:#dbc59d;
  --text:#4a2e1a;
  --muted:#8c785d;
  --brown:#81391f;
  --brown2:#632815;

  --off:#0c6b39;
  --off-bg:#e7f3ea;

  --def:#c3382c;
  --def-bg:#fae7e4;

  --gold:#b57600;
  --gold-bg:#fff1c8;

  --shadow:0 8px 24px rgba(88,57,24,.12);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  padding:8px;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at top left,rgba(255,255,255,.78),transparent 26%),
    linear-gradient(180deg,#f8edcf,#ead7ad);
}

.app{
  max-width:1600px;
  margin:auto;
}

/* =========================
   HEADER
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;

  padding:10px 12px;
  margin-bottom:8px;

  border:1px solid var(--line);
  border-radius:11px;

  background:
    linear-gradient(180deg,#f3dfb5,#e7c992);

  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.crest{
  width:42px;
  height:48px;

  display:grid;
  place-items:center;

  flex:0 0 42px;

  border:2px solid #5d2816;
  border-radius:8px 8px 14px 14px;

  background:
    linear-gradient(180deg,#a94425,#702814);

  color:#ffe6a8;

  font-size:23px;
  font-weight:900;

  box-shadow:
    inset 0 0 0 2px rgba(255,220,140,.35);
}

.brand h1{
  margin:0;

  font:
    700 24px Georgia,serif;

  color:#5b2617;

  line-height:1;
}

.brand-sub{
  margin-top:4px;

  font-size:11px;
  font-weight:700;

  color:#6d5134;
}

.updated{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-top:5px;

  padding:3px 8px;

  border-radius:99px;

  border:1px solid #cfb67f;

  background:
    rgba(255,249,230,.75);

  font-size:10px;
  font-weight:700;
}

.updated:before{
  content:"●";

  color:#33a55a;

  font-size:8px;
}

.langs{
  display:flex;
  gap:5px;
}

.lang-btn{
  height:34px;
  min-width:44px;

  border:1px solid #b89159;
  border-radius:7px;

  background:#fff8e8;

  color:#5e341f;

  font-weight:800;

  cursor:pointer;
}

.lang-btn.active{
  background:
    linear-gradient(180deg,#9a4023,#722914);

  color:#fff;

  border-color:#672713;
}

/* =========================
   FILTRE
========================= */

.toolbar{
  display:flex;
  align-items:center;

  gap:7px;

  flex-wrap:wrap;

  padding:7px 8px;

  margin-bottom:8px;

  border:1px solid #cfb27f;
  border-radius:10px;

  background:
    rgba(255,248,231,.93);
}

.filter-label{
  font-size:12px;
  font-weight:900;

  color:#6b351f;

  margin-right:2px;
}

.filter-btn{
  height:34px;

  padding:0 15px;

  border-radius:7px;

  border:1px solid #b99d6f;

  background:#fffaf0;

  font-weight:900;

  cursor:pointer;

  color:#5d432f;
}

.filter-btn[data-filter="off"]{
  border-color:#5f956f;
}

.filter-btn[data-filter="def"]{
  border-color:#d57d72;
}

.filter-btn[data-filter="counts"]{
  border-color:#c79a39;
}

.filter-btn.active[data-filter="all"]{
  background:#6c3b23;
  color:#fff;
}

.filter-btn.active[data-filter="off"]{
  background:
    linear-gradient(180deg,#26834e,#0e6638);

  color:#fff;
}

.filter-btn.active[data-filter="def"]{
  background:
    linear-gradient(180deg,#e76c5e,#c33b2e);

  color:#fff;
}

.filter-btn.active[data-filter="counts"]{
  background:
    linear-gradient(180deg,#e7b443,#b77908);

  color:#fff;
}

.search-wrap{
  margin-left:auto;

  display:flex;

  align-items:center;

  min-width:240px;

  flex:1;

  max-width:390px;
}

.search-wrap input{
  width:100%;
  height:34px;

  border:1px solid #b99d6f;
  border-radius:7px;

  background:#fffdf7;

  padding:0 10px;

  font-size:12px;

  outline:none;
}

.reset-btn{
  height:34px;

  padding:0 13px;

  border:1px solid #6d2816;
  border-radius:7px;

  background:
    linear-gradient(180deg,#963c21,#6c2715);

  color:#fff;

  font-weight:800;

  cursor:pointer;
}

/* =========================
   LEGENDA
========================= */

.legend{
  display:flex;

  align-items:center;

  gap:7px;

  flex-wrap:wrap;

  margin-bottom:6px;

  font-size:10px;

  color:#775b3f;
}

.legend b{
  padding:3px 7px;

  border-radius:99px;
}

.legend .loff{
  color:var(--off);

  background:var(--off-bg);

  border:1px solid #b9d6c0;
}

.legend .ldef{
  color:var(--def);

  background:var(--def-bg);

  border:1px solid #e7b8b2;
}

.legend .lgold{
  color:#8c5900;

  background:var(--gold-bg);

  border:1px solid #e4c774;
}

/* =========================
   TABEL
========================= */

.table-shell{
  border:1px solid var(--line);

  border-radius:9px;

  overflow:hidden;

  background:var(--paper);

  box-shadow:var(--shadow);
}

.table-scroll{
  width:100%;

  overflow-x:auto;

  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;

  min-width:1010px;

  border-collapse:collapse;

  table-layout:fixed;

  font-size:11px;

  font-variant-numeric:tabular-nums;

  background:var(--paper);
}

thead th{
  height:40px;

  padding:3px 2px;

  text-align:center;

  background:
    linear-gradient(180deg,#edd7a8,#e4c58c);

  border-right:1px solid #d0b47c;

  border-bottom:2px solid var(--line);

  color:#53351f;

  position:sticky;

  top:0;

  z-index:5;
}

th.col-player{
  width:130px;
}

th.col-village{
  width:145px;
}

th.col-coord{
  width:84px;
}

th.col-points{
  width:68px;
}

th.unit-col{
  width:53px;
}

thead th.off-head{
  background:
    linear-gradient(180deg,#e6ecd1,#d5e3c1);
}

thead th.def-head{
  background:
    linear-gradient(180deg,#f1d7c8,#e9c8b8);
}

thead th.count-head{
  background:
    linear-gradient(180deg,#f4dfaa,#e7c577);
}

.unit-h{
  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:1px;
}

.unit-h .ico{
  font-size:17px;

  line-height:17px;
}

.unit-h .abbr{
  font-size:8px;

  font-weight:900;
}

tbody td{
  height:27px;

  padding:3px 5px;

  border-right:1px solid #eadcc1;

  border-bottom:1px solid #dfd0b4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-align:right;

  background:#fff9e9;
}

tbody tr:nth-child(even) td{
  background:#fcf3dd;
}

tbody tr:hover td{
  background:#f7e7c6;
}

.player-cell{
  text-align:left!important;

  font-weight:800;

  background:#ead7b5!important;

  border-right:2px solid #b18a51!important;

  vertical-align:middle;

  padding-left:8px!important;
}

.village-cell{
  text-align:left!important;
}

.coord-cell{
  text-align:center!important;
}

.no-data{
  text-align:left!important;

  color:#9b8b75;

  font-style:italic;

  font-size:12px;

  background:#fff9e9!important;
}

/* OFF = VERDE */

.val-off{
  color:var(--off);

  font-weight:900;
}

/* DEFF = ROȘU */

.val-def{
  color:var(--def);

  font-weight:900;
}

/* CONȚI = GOLD */

.val-count{
  color:var(--gold);

  font-weight:900;
}

.val-zero{
  color:#9a907e;
}

.group-start td{
  border-top:2px solid #9f7440;
}

/* =========================
   FOOTER
========================= */

.footerbar{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  flex-wrap:wrap;

  margin-top:8px;

  padding:7px 8px;

  border:1px solid #cfb27f;

  border-radius:9px;

  background:
    rgba(255,248,231,.95);
}

.page-size{
  display:flex;

  align-items:center;

  gap:5px;

  font-size:11px;
}

.page-size select{
  height:32px;

  border:1px solid #b99d6f;

  border-radius:6px;

  background:#fff;

  padding:0 8px;
}

.pager{
  display:flex;

  align-items:center;

  gap:8px;
}

.page-btn{
  height:34px;

  padding:0 13px;

  border:1px solid #6d2816;

  border-radius:7px;

  background:
    linear-gradient(180deg,#8d3b21,#6c2816);

  color:#fff;

  font-weight:800;

  cursor:pointer;
}

.page-btn:disabled{
  opacity:.38;

  cursor:not-allowed;
}

.page-info{
  font-size:11px;

  font-weight:800;
}

.footer-stats{
  display:flex;

  gap:6px;

  flex-wrap:wrap;
}

.badge{
  padding:5px 8px;

  border-radius:7px;

  border:1px solid #d3ba89;

  background:#fffaf0;

  font-size:10px;

  font-weight:800;
}

.badge.off{
  color:var(--off);
}

.badge.def{
  color:var(--def);
}

.badge.gold{
  color:var(--gold);
}

.empty{
  padding:25px;

  text-align:center;

  font-weight:800;

  color:#856b4e;

  background:#fff8e7;
}

/* =========================
   TELEFON
========================= */

@media(max-width:900px){

  body{
    padding:4px;
  }

  .topbar{
    padding:7px 8px;

    margin-bottom:5px;
  }

  .crest{
    width:34px;

    height:39px;

    flex-basis:34px;

    font-size:18px;
  }

  .brand h1{
    font-size:19px;
  }

  .brand-sub{
    font-size:9px;
  }

  .updated{
    font-size:8px;

    margin-top:3px;

    padding:2px 6px;
  }

  .langs{
    margin-left:auto;
  }

  .lang-btn{
    height:30px;

    min-width:38px;

    font-size:10px;
  }

  .toolbar{
    padding:5px;

    gap:4px;

    margin-bottom:5px;
  }

  .filter-label{
    display:none;
  }

  .filter-btn{
    height:30px;

    padding:0 10px;

    font-size:10px;
  }

  .search-wrap{
    order:5;

    max-width:none;

    min-width:100%;

    margin-left:0;
  }

  .search-wrap input{
    height:31px;

    font-size:11px;
  }

  .reset-btn{
    height:30px;

    font-size:10px;

    padding:0 9px;
  }

  .legend{
    font-size:8px;

    margin-bottom:4px;

    gap:4px;
  }

  table{
    font-size:10px;

    min-width:950px;
  }

  tbody td{
    height:25px;

    padding:2px 4px;
  }

  .footerbar{
    padding:5px;

    gap:5px;
  }

  .footer-stats{
    width:100%;

    justify-content:center;
  }

  .badge{
    font-size:9px;

    padding:4px 6px;
  }
}

@media(max-width:480px){

  .brand-sub{
    max-width:270px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .page-size{
    display:none;
  }

  .footerbar{
    justify-content:center;

    position:sticky;

    bottom:3px;

    z-index:20;

    box-shadow:
      0 6px 18px rgba(75,44,17,.18);
  }

  .footer-stats{
    display:none;
  }

  .pager{
    width:100%;

    justify-content:space-between;
  }

  .page-btn{
    height:31px;

    font-size:10px;

    padding:0 10px;
  }

  .page-info{
    font-size:9px;
  }
}
</style>
</head>

function isDef(v){

  return hasAny(
    v.troops,
    DEF_INDEXES
  );

}


/* CONȚI */

function hasCount(v){

  return (
    Array.isArray(v.troops)
    &&
    Number(
      v.troops[COUNT_INDEX] || 0
    ) > 0
  );

}


/* FILTRARE SAT */

function villageMatches(
  v,
  pname
){

  if(
    activeFilter === "off"
    &&
    !isOff(v)
  ){

    return false;

  }


  if(
    activeFilter === "def"
    &&
    !isDef(v)
  ){

    return false;

  }


  if(
    activeFilter === "counts"
    &&
    !hasCount(v)
  ){

    return false;

  }


  if(searchText){

    const hay =
      `${pname} ${v.name} ${v.coords}`
      .toLowerCase();


    if(
      !hay.includes(searchText)
    ){

      return false;

    }

  }


  return true;

}


/* JUCĂTORI DUPĂ FILTRARE */

function getFilteredPlayers(){

  return playersData

    .map(
      p => ({

        name:
          p.name,

        villages:
          p.villages.filter(
            v =>
              villageMatches(
                v,
                p.name
              )
          )

      })
    )

    .filter(
      p =>
        p.villages.length
    );

}


/* TOTAL SATE */

function totalVillageCount(){

  return playersData.reduce(

    (
      total,
      player
    ) =>

      total
      +
      player.villages.length,

    0
  );

}


/* STATISTICI */

function allVillageStats(){

  const all =
    playersData.flatMap(
      p =>
        p.villages
    );


  return {

    off:
      all.filter(
        isOff
      ).length,

    def:
      all.filter(
        isDef
      ).length,

    counts:
      all.filter(
        hasCount
      ).length

  };

}


/* CULOAREA FIECĂREI TRUPE */

function cellClass(
  index,
  value
){

  if(
    Number(value) === 0
  ){

    return "val-zero";

  }


  if(
    index === COUNT_INDEX
  ){

    return "val-count";

  }


  /*
     Spionul este verde.
     OFF este verde.
  */

  if(
    index === SPY_INDEX
    ||
    OFF_INDEXES.includes(index)
  ){

    return "val-off";

  }


  /*
     Restul trupelor sunt DEFF
     și sunt roșii.
  */

  return "val-def";

}

/* =========================
   TABEL
========================= */

function renderTable(){

  const x =
    t();


  const list =
    getFilteredPlayers();


  const pages =
    Math.max(

      1,

      Math.ceil(
        list.length
        /
        perPage
      )

    );


  if(
    page > pages
  ){

    page =
      pages;

  }


  const subset =
    list.slice(

      (page - 1)
      *
      perPage,

      page
      *
      perPage

    );


  const tbody =
    document
      .getElementById(
        "tbody"
      );


  tbody.innerHTML =
    "";


  subset.forEach(

    (
      player,
      playerIndex
    ) => {

      player.villages.forEach(

        (
          village,
          villageIndex
        ) => {

          const tr =
            document
              .createElement(
                "tr"
              );


          if(
            playerIndex > 0
            &&
            villageIndex === 0
          ){

            tr.classList
              .add(
                "group-start"
              );

          }


          if(
            villageIndex === 0
          ){

            const td =
              document
                .createElement(
                  "td"
                );


            td.className =
              "player-cell";


            td.rowSpan =
              player
                .villages
                .length;


            td.textContent =
              player.name;


            tr.appendChild(
              td
            );

          }


          const tdVillage =
            document
              .createElement(
                "td"
              );


          tdVillage.className =
            "village-cell";


          tdVillage.textContent =
            village.name;


          tr.appendChild(
            tdVillage
          );


          const tdCoords =
            document
              .createElement(
                "td"
              );


          tdCoords.className =
            "coord-cell";


          tdCoords.textContent =
            village.coords;


          tr.appendChild(
            tdCoords
          );


          const tdPoints =
            document
              .createElement(
                "td"
              );


          tdPoints.textContent =
            village.pts;


          tr.appendChild(
            tdPoints
          );


          /* NU EXISTĂ DATE */

          if(
            !Array.isArray(
              village.troops
            )
          ){

            const td =
              document
                .createElement(
                  "td"
                );


            td.colSpan =
              11;


            td.className =
              "no-data";


            td.textContent =
              x.noData;


            tr.appendChild(
              td
            );

          }


          /* EXISTĂ TRUPE */

          else{

            village
              .troops
              .forEach(

                (
                  value,
                  index
                ) => {

                  const td =
                    document
                      .createElement(
                        "td"
                      );


                  td.className =
                    cellClass(
                      index,
                      value
                    );


                  td.textContent =
                    fmt(value);


                  tr.appendChild(
                    td
                  );

                }

              );

          }


          tbody.appendChild(
            tr
          );

        }

      );

    }

  );


  /* MESAJ DACĂ NU EXISTĂ REZULTATE */

  document
    .getElementById(
      "empty"
    )
    .hidden =
      list.length !== 0;


  document
    .getElementById(
      "tableScroll"
    )
    .style
    .display =
      list.length
        ? ""
        : "none";


  /* PAGINARE */

  document
    .getElementById(
      "pageInfo"
    )
    .textContent =
      `${x.page} ${page} ${x.of} ${pages}`;


  const prev =
    document
      .getElementById(
        "prev"
      );


  const next =
    document
      .getElementById(
        "next"
      );


  prev.textContent =
    x.prev;


  next.textContent =
    x.next;


  prev.disabled =
    page <= 1;


  next.disabled =
    page >= pages;


  /* STATISTICI */

  const stats =
    allVillageStats();


  document
    .getElementById(
      "offStat"
    )
    .textContent =
      `⚔ ${x.offVillages}: ${stats.off}`;


  document
    .getElementById(
      "defStat"
    )
    .textContent =
      `🛡 ${x.defVillages}: ${stats.def}`;


  document
    .getElementById(
      "countStat"
    )
    .textContent =
      `♛ ${x.countVillages}: ${stats.counts}`;


  requestAnimationFrame(
    fitTableToScreen
  );

}


/* =========================
   ÎNCADRARE PE TELEFON
========================= */

function fitTableToScreen(){

  const wrap =
    document
      .getElementById(
        "tableScroll"
      );


  const table =
    document
      .getElementById(
        "troopTable"
      );


  if(
    !wrap
    ||
    !table
  ){

    return;

  }


  table.style.zoom =
    "1";


  wrap.style.overflowX =
    window.innerWidth <= 900
      ? "hidden"
      : "auto";


  if(
    window.innerWidth <= 900
  ){

    const natural =
      table.scrollWidth;


    const available =
      wrap.clientWidth;


    if(
      natural
      >
      available
    ){

      const scale =
        Math.max(

          .42,

          Math.min(

            1,

            available
            /
            natural

          )

        );


      table.style.zoom =
        String(scale);

    }

  }

}


/* =========================
   RENDER GENERAL
========================= */

function render(){

  renderTexts();

  renderTable();

}


/* =========================
   FILTRE
========================= */

document
.querySelectorAll(
  ".filter-btn"
)
.forEach(

  btn =>

    btn.addEventListener(

      "click",

      () => {

        activeFilter =
          btn.dataset.filter;


        page =
          1;


        document
          .querySelectorAll(
            ".filter-btn"
          )
          .forEach(

            item =>

              item
                .classList
                .toggle(

                  "active",

                  item === btn

                )

          );


        renderTable();

      }

    )

);


/* =========================
   LIMBI
========================= */

document
.querySelectorAll(
  ".lang-btn"
)
.forEach(

  btn =>

    btn.addEventListener(

      "click",

      () => {

        lang =
          btn.dataset.lang;


        page =
          1;


        render();

      }

    )

);


/* =========================
   CĂUTARE
========================= */

document
.getElementById(
  "search"
)
.addEventListener(

  "input",

  event => {

    searchText =
      event
        .target
        .value
        .trim()
        .toLowerCase();


    page =
      1;


    renderTable();

  }

);


/* =========================
   RESET
========================= */

document
.getElementById(
  "resetBtn"
)
.addEventListener(

  "click",

  () => {

    activeFilter =
      "all";


    searchText =
      "";


    page =
      1;


    document
      .getElementById(
        "search"
      )
      .value =
        "";


    document
      .querySelectorAll(
        ".filter-btn"
      )
      .forEach(

        item =>

          item
            .classList
            .toggle(

              "active",

              item
                .dataset
                .filter
              ===
              "all"

            )

      );


    renderTable();

  }

);


/* =========================
   10 / 15 JUCĂTORI
========================= */

document
.getElementById(
  "pageSize"
)
.addEventListener(

  "change",

  event => {

    perPage =
      Number(
        event.target.value
      )
      ||
      10;


    page =
      1;


    renderTable();

  }

);


/* =========================
   ANTERIOR
========================= */

document
.getElementById(
  "prev"
)
.addEventListener(

  "click",

  () => {

    if(
      page > 1
    ){

      page--;


      renderTable();


      window.scrollTo({

        top:
          0,

        behavior:
          "smooth"

      });

    }

  }

);


/* =========================
   URMĂTOR
========================= */

document
.getElementById(
  "next"
)
.addEventListener(

  "click",

  () => {

    const pages =
      Math.max(

        1,

        Math.ceil(

          getFilteredPlayers()
            .length
          /
          perPage

        )

      );


    if(
      page < pages
    ){

      page++;


      renderTable();


      window.scrollTo({

        top:
          0,

        behavior:
          "smooth"

      });

    }

  }

);


/* =========================
   REDIMENSIONARE
========================= */

window
.addEventListener(

  "resize",

  () =>

    requestAnimationFrame(
      fitTableToScreen
    )

);


/* =========================
   PORNIRE
========================= */

render();

</script>
